<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2a8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="기적플래너">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>기적 플래너</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
:root{
  --bg:#f4f5fb; --panel:#ffffff; --panel2:#f7f8fc; --line:#e4e6f0; --text:#1d2033; --sub:#6b7089;
  --accent:#5b3fd6; --accent2:#8a4fe0; --accent-soft:#ece8ff; --ok:#1f9d63; --ok-soft:#e2f6ec;
  --warn:#e59a18; --danger:#e0414f; --danger-soft:#fde8ea; --low:#2f9e8f;
  --shadow:0 2px 10px rgba(30,30,80,.06);
}
:root[data-theme="dark"]{
  --bg:#12131c; --panel:#1b1d2a; --panel2:#222536; --line:#2e3147; --text:#e8e9f3; --sub:#9a9fbc;
  --accent:#8f7bff; --accent2:#b28bff; --accent-soft:#2c2750; --ok:#3ccf8e; --ok-soft:#173a2b;
  --danger:#ff6673; --danger-soft:#3d1d24; --shadow:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:210px;flex:none;background:linear-gradient(170deg,#2b2170,#4b2a9a 60%,#7a3aa8);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:4px 8px 14px}
.logo span{font-size:26px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:transparent;color:#e9e4ff;text-align:left;font-size:14px;width:100%}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:#fff;color:#3b2a8f;font-weight:700}
.nav .k{margin-left:auto;font-size:11px;opacity:.6}
.side{overflow-y:auto}
.q4{background:rgba(255,214,107,.16);border:1px solid rgba(255,214,107,.55);border-radius:12px;padding:10px 10px 8px;color:#fff}
.side .q4{margin-top:auto}
.q4 b{display:block;font-size:12.5px;color:#ffd66b;margin-bottom:6px;letter-spacing:-.2px}
.q4 ol{margin:0;padding:0;list-style:none;counter-reset:q;display:flex;flex-direction:column;gap:6px}
.q4 li{counter-increment:q;display:flex;gap:7px;font-size:12.5px;line-height:1.45;font-weight:600}
.q4 li::before{content:counter(q);flex:none;width:18px;height:18px;border-radius:50%;background:#ffd66b;color:#3b2a8f;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.q4card{display:none}
.side .aff{margin-top:8px;font-size:12px;line-height:1.7;background:rgba(255,255,255,.1);border-radius:10px;padding:10px;color:#fff}
.side .bk{font-size:11px;opacity:.75;padding:6px 4px 0}
.main{flex:1;min-width:0;padding:18px 22px 40px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h1{font-size:20px;margin:0;flex:1}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:260px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:9px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g-home{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.muted{color:var(--sub)}
.small{font-size:12px}
/* quote banner */
.qbar{border-radius:16px;overflow:hidden;background:linear-gradient(120deg,#2b2170,#5b35c8 55%,#e0703a);color:#fff;margin-bottom:14px;box-shadow:var(--shadow)}
.fixed{display:flex;flex-wrap:wrap;gap:8px 22px;padding:14px 20px 10px;font-weight:800;font-size:18px;letter-spacing:-.2px}
.fixed b{white-space:nowrap}
.fixed b::before{content:"✦ ";color:#ffd66b}
.slider{position:relative;padding:4px 56px 16px;min-height:78px}
.slides{position:relative;height:72px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
.slide.on{opacity:1;transform:none}
.slide .q{font-size:17px;font-weight:600}
.slide .a{font-size:12px;opacity:.8;margin-top:2px}
.slide .tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:0 8px;font-size:11px;margin-right:6px}
.sbtn{position:absolute;top:18px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:16px}
.sbtn.l{left:14px}.sbtn.rr{right:14px}
.dots{display:flex;gap:5px;justify-content:center;padding-top:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.dots i.on{background:#fff;width:16px;border-radius:4px}
.dots{align-items:center;gap:10px}.scount{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.sprog{width:140px;height:4px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}.sprog i{display:block;height:100%;background:#fff;transition:width .3s}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--sub)}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead .t{font-size:17px;font-weight:800;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.cal .dw:first-child,.cal .sun .dn{color:var(--danger)}
.cal .sat .dn{color:#3a7bd5}
.cell{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:4px 6px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell:hover{border-color:var(--accent)}
.cell.out{opacity:.4}
.cell.today{border:2px solid var(--accent)}
.cell.sel{background:var(--accent-soft)}
.cell .dn{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.cell .hol .dn,.cell.hol .dn{color:var(--danger)}
.cell .hn{font-size:10px;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cnt{font-size:11px;border-radius:6px;padding:0 4px;background:var(--panel);align-self:flex-start}
.cell .cnt.full{background:var(--ok-soft);color:var(--ok)}
.cell .dd{font-size:10px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ic{font-size:10px}
/* tasks */
.addf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.addf input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.addf select,.addf input[type=time],.addf input[type=date]{padding:7px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);border-left:4px solid var(--warn)}
.task.pri-H{border-left-color:var(--danger)}
.task.pri-L{border-left-color:var(--low)}
.task input.chk{width:19px;height:19px;margin:1px 0 0;accent-color:var(--ok);cursor:pointer;flex:none}
.task .tb{flex:1;min-width:0}
.task .tt{word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--sub)}
.task .tm{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:var(--sub);margin-top:2px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-size:11px}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.green{background:var(--ok-soft);color:var(--ok)}
.task .ta{display:flex;gap:2px;opacity:.45;transition:.15s;flex:none}
.task:hover .ta{opacity:1}
.ma{display:inline-flex;gap:1px;margin-left:auto;flex:none;opacity:.4;transition:.15s}
.ma button{border:0;background:transparent;padding:0 4px;border-radius:5px;color:var(--sub);font-size:12px;line-height:18px}
.ma button:hover{background:var(--line);color:var(--text)}
.ma button.x:hover{background:var(--danger-soft);color:var(--danger)}
.mrow{display:flex;align-items:flex-start;gap:5px;padding:1px 0}
.mrow:hover .ma,tr:hover .ma,.wday .mini li:hover .ma{opacity:1}
.mrow label{flex:1;min-width:0}
.task .ta button{border:0;background:transparent;padding:2px 5px;border-radius:6px;color:var(--sub)}
.task .ta button:hover{background:var(--line);color:var(--text)}
.empty{padding:18px;text-align:center;color:var(--sub);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.limit{font-size:12px;color:var(--sub)}
.limit.full{color:var(--danger);font-weight:700}
.notice{display:flex;align-items:center;gap:8px;background:#fff5e0;color:#8a5a00;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
:root[data-theme="dark"] .notice{background:#3a2e12;color:#ffd27a}
/* week */
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:180px}
.wday.today{border:2px solid var(--accent)}
.wday h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.wday .mini{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
.wday .mini li{display:flex;gap:5px;font-size:12px;align-items:flex-start}
.wday .mini li.done span{text-decoration:line-through;color:var(--sub)}
.wday .mini input{margin-top:2px;accent-color:var(--ok)}
.wday .qa{width:100%;margin-top:6px;padding:5px 7px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
textarea.area{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);resize:vertical;line-height:1.6}
/* journal */
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.jf{margin-bottom:12px}
.jf label{display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:5px;font-size:13px}
.jf label .r{margin-left:auto}
.stars button{border:0;background:none;font-size:22px;padding:0 1px;color:#c9cbe0}
.stars button.on{color:#f5b301}
.moods button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:20px;padding:2px 8px;margin-right:4px}
.moods button.on{border-color:var(--accent);background:var(--accent-soft)}
.jlist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.jitem{padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel2)}
.jitem.on{border-color:var(--accent);background:var(--accent-soft)}
.jitem .d{font-weight:700;font-size:13px}
.jitem .p{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--ok)}
/* memo */
.memo-add{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.memo-add input,.memo-add textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.memo-add textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 11px;font-size:12px}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.memos{columns:3 260px;column-gap:12px}
.memo{break-inside:avoid;margin-bottom:12px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;position:relative}
.memo h4{margin:0 0 4px;font-size:14px;padding-right:90px}
.memo .mtools{position:absolute;top:6px;right:6px;display:flex;gap:2px}
.memo .mtools button{border:0;background:rgba(127,127,160,.12);border-radius:7px;padding:2px 7px;font-size:13px;color:var(--text)}
.memo .mtools button:hover{background:var(--accent);color:#fff}
.memo .mtools button.x:hover{background:var(--danger);color:#fff}
.memo .mtools .pin{position:static;opacity:.35;background:rgba(127,127,160,.12)}
.memo .mtools .pin.on{opacity:1}
.memo:not(:has(h4)) .body{padding-right:90px}
.memo .body{white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:260px;overflow:hidden}
.memo .body .ck{cursor:pointer}
.memo .body .ck.x{text-decoration:line-through;color:var(--sub)}
.memo .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--sub);align-items:center}
.memo .pin{position:absolute;top:8px;right:10px;border:0;background:none;font-size:15px;opacity:.35}
.memo .pin.on{opacity:1}
.memo.c-yellow{background:#fff8d6;border-color:#f1e3a0}.memo.c-green{background:#e3f7e9;border-color:#bfe6cb}
.memo.c-blue{background:#e3efff;border-color:#bcd4f5}.memo.c-pink{background:#ffe6ef;border-color:#f3c3d4}.memo.c-purple{background:#efe8ff;border-color:#d6c9fb}
:root[data-theme="dark"] .memo.c-yellow{background:#3a3418}:root[data-theme="dark"] .memo.c-green{background:#173226}
:root[data-theme="dark"] .memo.c-blue{background:#172a44}:root[data-theme="dark"] .memo.c-pink{background:#3d1f2b}:root[data-theme="dark"] .memo.c-purple{background:#2a2350}
:root[data-theme="dark"] .memo[class*="c-"]{border-color:var(--line)}
.colors{display:flex;gap:6px}
.colors button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.colors button.on{border-color:var(--accent)}
/* year */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.heat i.l1{background:#d9d0ff;border-color:#d9d0ff}.heat i.l2{background:#a996ff;border-color:#a996ff}.heat i.l3{background:#7457f0;border-color:#7457f0}.heat i.l4{background:#4527c2;border-color:#4527c2}
.heat i.none{visibility:hidden}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:170px;padding-top:10px}
.mb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--sub);cursor:pointer}
.mb i{display:block;width:70%;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:5px 5px 2px 2px;min-height:2px}
.mb b{color:var(--text);font-size:11px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--sub);font-weight:600;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.sec{margin-bottom:14px}
/* archive */
.agroup h4{margin:14px 0 6px;font-size:13px;color:var(--sub)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,10,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px}
.modal .f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.modal .f label{font-size:12px;color:var(--sub);font-weight:600}
.modal input,.modal select,.modal textarea{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.modal textarea{min-height:160px;resize:vertical}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.sres{display:flex;flex-direction:column;gap:6px}
.sres div{padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.sres div:hover{border-color:var(--accent)}
kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel2)}
@media (max-width:1100px){.g-home,.g2,.jgrid{grid-template-columns:1fr}.week7{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:20;padding:6px}.side .logo,.side .aff,.side .q4,.side .bk,.nav .k{display:none}.nav{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;width:auto}.main{padding:12px 16px 90px}.search{width:140px}}
/* 터치 기기(아이폰·아이패드): 버튼 항상 표시, 확대 방지 */
@media (hover:none){.task .ta,.ma{opacity:1}.task .ta button,.ma button{padding:4px 8px;font-size:14px}}
@supports (padding:env(safe-area-inset-top)){
  .main{padding-top:max(18px,env(safe-area-inset-top));padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
  .side{padding-top:max(18px,env(safe-area-inset-top))}}
@media (max-width:760px){
  .card h3{flex-wrap:wrap;row-gap:6px}.card h3 .r{margin-left:0;flex-wrap:wrap}
  .q4card{display:block;background:linear-gradient(120deg,#2b2170,#5b35c8);margin-bottom:14px}.q4card li{font-size:14px}
  input,select,textarea{font-size:16px!important}
  .nav{flex:none;white-space:nowrap;font-size:10.5px;padding:5px 9px;line-height:1.3;text-align:center}
  .side{gap:2px;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
  .slides{height:88px}
  .side{padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .main{padding-left:16px;padding-right:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .topbar h1{font-size:17px}.fixed{font-size:15px;padding:12px 14px 6px}.slider{padding:4px 44px 14px}.slide .q{font-size:15px}
  .cell{min-height:54px;padding:3px}.cell .hn,.cell .dd{display:none}.stats{gap:8px}.stat .n{font-size:18px}
  .week7{grid-template-columns:1fr}.memos{columns:1}.addf select,.addf input[type=time],.addf input[type=date]{flex:1}
  table.t{font-size:12px}.toast{bottom:calc(90px + env(safe-area-inset-bottom))}}
.syncb.ok{color:var(--ok)}.syncb.err{color:var(--danger);border-color:var(--danger)}.syncb.busy .t{opacity:.6}
.sync-steps{margin:0;padding-left:20px;line-height:1.9;font-size:13px}.sync-steps input{width:100%;margin-top:3px}
@media (max-width:760px){.syncb .t{display:none}}

/* ---- 동기화용 변경 추적: 항목마다 마지막 수정 시각(ks)과 삭제 기록(tomb)을 남김 ---- */
const ARR_F=['tasks','memos','routines','ddays','habits','ideas','money'],MAP_F=['journals','weekNotes','monthNotes','routineApplied','habitLog','moneyBudget'];
function units(st){const m=new Map();
  ARR_F.forEach(a=>(st[a]||[]).forEach(x=>m.set(a+':'+x.id,x)));
  Object.entries(st.yearGoals||{}).forEach(([y,gs])=>(gs||[]).forEach(g=>m.set('yearGoals:'+y+':'+g.id,g)));
  MAP_F.forEach(n=>Object.entries(st[n]||{}).forEach(([k,v])=>m.set(n+':'+k,v)));
  m.set('cats',st.cats||[]);m.set('customQuotes',st.customQuotes||[]);return m}
function unitsJSON(st){const m=new Map();for(const[k,v] of units(st))m.set(k,JSON.stringify(v));return m}
function fromUnits(m,base){const st=Object.assign({},base);ARR_F.forEach(a=>st[a]=[]);st.yearGoals={};MAP_F.forEach(n=>st[n]={});
  for(const[k,v] of m){if(k==='cats'||k==='customQuotes'){st[k]=v;continue}
    const i=k.indexOf(':'),n=k.slice(0,i),rest=k.slice(i+1);
    if(ARR_F.includes(n))st[n].push(v);else if(n==='yearGoals'){(st.yearGoals[rest.slice(0,rest.indexOf(':'))]??=[]).push(v)}else st[n][rest]=v}
  return st}
function mergeStates(L,R){ // 두 기기 데이터를 항목 단위로 합침 (더 최근 수정이 이김, 삭제도 반영)
  const lu=units(L),ru=units(R),lk=L.ks||{},rk=R.ks||{},tomb=Object.assign({},L.tomb||{});
  Object.entries(R.tomb||{}).forEach(([k,t])=>{if(!(tomb[k]>=t))tomb[k]=t});
  const cut=Date.now()-365*864e5;Object.keys(tomb).forEach(k=>{if(tomb[k]<cut)delete tomb[k]});
  const out=new Map(),ks={};
  for(const k of new Set([...lu.keys(),...ru.keys()])){
    const lt=lu.has(k)?(lk[k]||1):-1,rt=ru.has(k)?(rk[k]||1):-1,ts=Math.max(lt,rt);
    if((tomb[k]||0)>=ts)continue;out.set(k,rt>lt?ru.get(k):lu.get(k));ks[k]=ts}
  const st=fromUnits(out,L);st.ks=ks;st.tomb=tomb;return st}
function canon(st){return JSON.stringify([[...unitsJSON(st)].sort((a,b)=>a[0]<b[0]?-1:1),Object.entries(st.ks||{}).sort(),Object.entries(st.tomb||{}).sort()])}
let prevJ=new Map();
function stamp(){const cur=unitsJSON(S),now=Date.now();S.ks??={};S.tomb??={};
  for(const[k,j] of cur)if(prevJ.get(k)!==j){S.ks[k]=now;delete S.tomb[k]}
  for(const k of prevJ.keys())if(!cur.has(k)){S.tomb[k]=now;delete S.ks[k]}
  prevJ=cur}
function initStamps(){S.ks??={};S.tomb??={};for(const k of units(S).keys())if(!S.ks[k])S.ks[k]=1;prevJ=unitsJSON(S)}
initStamps();

let slideIdx=0,slideTimer=null,slideData=[];
const SLIDE_MS=3000; // 슬라이드 넘김 간격 (3초)
let slidePaused=false;
function buildSlides(){
  // 모든 명언을 매일 전부: 사업 명언 전체(매일 시작 위치만 바뀜) 사이사이에 실행 문구·마음 관리 명언을 번갈아 끼움
  const pool=QUOTES.concat(S.customQuotes.map(q=>[q,'나의 명언']));
  const dayN=Math.floor((parse(todayS())-new Date(2020,0,1))/864e5),st=(dayN*5)%pool.length;
  const biz=pool.slice(st).concat(pool.slice(0,st));
  const mine=EXEC.map(x=>({q:x[0],a:x[1],tag:'실행'})).concat(MIND.map(x=>({q:x[0],a:x[1],tag:'마음 관리'})));
  slideData=[];
  biz.forEach((q,i)=>{slideData.push({q:q[0],a:q[1],tag:i===0?'오늘의 명언':'사업 명언'});slideData.push(mine[i%mine.length])});
  for(let i=biz.length;i<mine.length;i++)slideData.push(mine[i]); // 사업 명언이 적을 때도 내 문구는 전부
  $('#slides').innerHTML=slideData.map((s,i)=>`<div class="slide" data-i="${i}"><div class="q">“${esc(s.q)}”</div><div class="a"><span class="tag">${s.tag}</span>— ${esc(s.a)}</div></div>`).join('');
  showSlide(0);
}
function showSlide(i){slideIdx=(i+slideData.length)%slideData.length;
  document.querySelectorAll('.slide').forEach((e,j)=>e.classList.toggle('on',j===slideIdx));
  $('#dots').innerHTML=`<span class="scount">${slideIdx+1} / ${slideData.length}</span><span class="sprog"><i style="width:${(slideIdx+1)/slideData.length*100}%"></i></span>${slidePaused?'<span class="scount">⏸ 멈춤</span>':''}`;
  clearInterval(slideTimer);slideTimer=setInterval(()=>{if(!slidePaused)showSlide(slideIdx+1)},SLIDE_MS);}
$('#sPrev').onclick=()=>showSlide(slideIdx-1);$('#sNext').onclick=()=>showSlide(slideIdx+1);
// 마우스를 올려두면 멈춤 (긴 문장 읽을 때)
$('.slides').addEventListener('mouseenter',()=>{slidePaused=true;showSlide(slideIdx)});

function calendar(){
  const first=parse(V.cal+'-01'),start=addDays(first,-first.getDay()),t=todayS();
  const byDay={};S.tasks.forEach(x=>{if(x.scope==='day'){(byDay[x.key]??={n:0,d:0}).n++;if(x.done)byDay[x.key].d++}});
  const dues={};S.tasks.forEach(x=>{if(x.due&&!x.done)(dues[x.due]??=[]).push(x.text)});

  let h=DOW.map(d=>`<div class="dw">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i),s=fmt(d),c=byDay[s],hol=holiday(s);
    const cls=['cell',d.getMonth()!==first.getMonth()?'out':'',s===t?'today':'',s===V.sel?'sel':'',d.getDay()===0?'sun':'',d.getDay()===6?'sat':'',hol?'hol':''].join(' ');
    h+=`<div class="${cls}" data-date="${s}"><div class="dn"><span>${d.getDate()}</span><span class="ic">${hDayPct(s)===1?'🌅':''}${S.journals[s]&&jHas(S.journals[s])?'📔':''}</span></div>
      ${hol?`<div class="hn">${hol}</div>`:''}

      ${dues[s]?`<div class="dd">📌 마감 ${dues[s].length}건</div>`:''}</div>`;
  }
  return `<div class="cal">${h}</div>`;
}
function streak(){
  const act=new Set();S.tasks.forEach(t=>{if(t.doneAt)act.add(localDateOfISO(t.doneAt))});
  Object.keys(S.journals).forEach(k=>{if(jHas(S.journals[k]))act.add(k)});
  Object.keys(S.habitLog||{}).forEach(k=>act.add(k));
  let n=0,d=new Date();if(!act.has(fmt(d)))d=addDays(d,-1);
  while(act.has(fmt(d))){n++;d=addDays(d,-1)}return n;
}

function archiveList(){
  const t=todayS();let from='',to='9999';
  if(V.aPeriod==='week'){from=mondayOf(t)}else if(V.aPeriod==='month'){from=monthOf(t)+'-01'}else if(V.aPeriod==='year'){from=t.slice(0,4)+'-01-01'}
  else if(V.aPeriod==='custom'){from=V.aFrom||'';to=V.aTo||'9999'}
  const q=V.aq.trim().toLowerCase();
  return S.tasks.filter(x=>x.done&&x.doneAt).filter(x=>{const d=localDateOfISO(x.doneAt);return d>=from&&d<=to})

}

const ideaTags=x=>[...new Set((x.text+' '+(x.note||'')).match(/#[^\s#.,!?()]+/g)||[])];
function addIdea(text,type,o={}){text=(text||'').trim();if(!text)return false;
  S.ideas.push({id:uid(),text,type:type||'idea',status:'new',star:false,note:o.note||'',createdAt:Date.now(),updatedAt:Date.now(),day:todayS()});return true}
function ideaLi(x){const tg=ideaTags(x);
  return `<li class="idea ty-${x.type} st-${x.status}" data-idea="${x.id}">
   <button class="istar ${x.star?'on':''}" data-istar="${x.id}" title="중요">★</button><span class="itype" title="${IT[x.type].n}">${IT[x.type].i}</span>
   <div class="tb"><div class="tt">${esc(x.text)}</div><div class="tm">
     <select class="ist" data-istatus="${x.id}" title="진행 상태">${Object.entries(IS).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v.i} ${v.n}</option>`).join('')}</select>
     <span>${x.day?x.day.slice(5).replace('-','/'):''}</span>${tg.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}${x.note?'<span title="상세 내용 있음">📎 상세</span>':''}${x.taskId?'<span class="chip green">할 일 등록됨</span>':''}</div></div>
   <div class="ta"><button data-itask="${x.id}" title="오늘 할 일로 보내기">→할일</button><button data-iedit="${x.id}" title="수정">✎</button><button data-idel="${x.id}" title="삭제">✕</button></div></li>`}
function ideaAddForm(id){return `<form class="idea-add" data-ideaform="${id}"><select name="type">${Object.entries(IT).map(([k,v])=>`<option value="${k}">${v.i} ${v.n}</option>`).join('')}</select>
  <input type="text" name="text" placeholder="떠오른 아이디어 · 해결해야 할 일을 바로 적고 Enter  (#태그 가능)" autocomplete="off"><button class="btn pri">저장</button></form>`}
function ideaHomeCard(){
  const open=S.ideas.filter(ideaOpen).sort((a,b)=>(b.star-a.star)||(b.createdAt-a.createdAt));
  const nI=open.filter(x=>x.type==='idea').length,nT=open.filter(x=>x.type==='todo').length,today=S.ideas.filter(x=>x.day===todayS()).length;
  return `<div class="card sec"><h3>💡 아이디어 노트 <span class="r"><span class="limit">오늘 ${today}개 · 💡 ${nI} · 🔧 해결할 일 ${nT}</span><button class="btn sm" data-go2="ideas">전체 보기 →</button></span></h3>
    ${ideaAddForm('home')}
    ${open.length?`<ul class="ideas cols">${open.slice(0,6).map(ideaLi).join('')}</ul>${open.length>6?`<div class="small muted" style="margin-top:6px">외 ${open.length-6}개 — [전체 보기]에서 확인</div>`:''}`:'<div class="empty">생각나는 아이디어, 해결해야 할 일을 바로 적어두세요. ⭐ 중요한 건 별표!</div>'}</div>`}
function rIdeas(){
  V.iType??='all';V.iStat??='open';V.iQ??='';V.iTag??='';V.iStar??=false;
  const q=V.iQ.trim().toLowerCase(),allTags=[...new Set(S.ideas.flatMap(ideaTags))].sort();
  const list=S.ideas.filter(x=>V.iType==='all'||x.type===V.iType)
    .filter(x=>V.iStat==='all'||(V.iStat==='open'?ideaOpen(x):x.status===V.iStat))
    .filter(x=>!V.iStar||x.star).filter(x=>!V.iTag||ideaTags(x).includes(V.iTag))
    .filter(x=>!q||(x.text+' '+(x.note||'')).toLowerCase().includes(q))
    .sort((a,b)=>(b.createdAt-a.createdAt));
  const g={};list.forEach(x=>(g[x.day||localDateOfISO(new Date(x.createdAt).toISOString())]??=[]).push(x));
  const mk=monthOf(todayS()),cnt=(f)=>S.ideas.filter(f).length;
  $('#view').innerHTML=`
  <div class="stats">
    <div class="stat"><div class="l">이번 달 기록</div><div class="n">${cnt(x=>(x.day||'').startsWith(mk))}개</div></div>
    <div class="stat"><div class="l">💡 진행 중 아이디어</div><div class="n">${cnt(x=>x.type==='idea'&&ideaOpen(x))}개</div></div>
    <div class="stat"><div class="l">🔧 해결할 일 (미해결)</div><div class="n" style="color:var(--danger)">${cnt(x=>x.type==='todo'&&ideaOpen(x))}개</div></div>
    <div class="stat"><div class="l">✅ 완료</div><div class="n">${cnt(x=>x.status==='done')}개</div></div>
  </div>
  <div class="card sec">${ideaAddForm('page')}<div class="small muted">Enter로 바로 저장 · 여러 줄을 붙여넣으면 한 번에 여러 개 저장 · 항목을 누르면 상세 내용을 적을 수 있어요</div></div>
  <div class="card sec"><div class="row">
    <input class="field" id="iq" placeholder="🔍 아이디어 검색" value="${esc(V.iQ)}" style="flex:1;min-width:160px">
    <select class="field" id="iType"><option value="all">전체 종류</option>${Object.entries(IT).map(([k,v])=>`<option value="${k}" ${V.iType===k?'selected':''}>${v.i} ${v.n}</option>`).join('')}</select>
    <select class="field" id="iStat"><option value="open" ${V.iStat==='open'?'selected':''}>진행 중 (완료·보류 제외)</option><option value="all" ${V.iStat==='all'?'selected':''}>전체 상태</option>${Object.entries(IS).map(([k,v])=>`<option value="${k}" ${V.iStat===k?'selected':''}>${v.i} ${v.n}</option>`).join('')}</select>
    <label class="small"><input type="checkbox" id="iStar" ${V.iStar?'checked':''}> ⭐ 중요만</label>
    <button class="btn sm" id="iCsv">⬇ 엑셀(CSV)</button><button class="btn sm danger" id="iClean">🧹 완료·보류 정리</button></div>
    ${allTags.length?`<div class="chips" style="margin:10px 0 0">${['',...allTags].map(t=>`<button class="fchip ${V.iTag===t?'on':''}" data-itag="${esc(t)}">${t?esc(t):'전체 태그'}</button>`).join('')}</div>`:''}</div>
  <div class="card">${Object.keys(g).length?Object.entries(g).map(([d,xs])=>`<div class="agroup"><h4>${d===todayS()?'오늘 · ':''}${kdate(d)} · ${xs.length}개</h4><ul class="ideas">${xs.sort((a,b)=>(b.star-a.star)||(b.createdAt-a.createdAt)).map(ideaLi).join('')}</ul></div>`).join(''):'<div class="empty">조건에 맞는 아이디어가 없어요.</div>'}</div>`;
  $('#iq').oninput=debounce(e=>{V.iQ=e.target.value;rIdeas();const i=$('#iq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250);
  $('#iType').onchange=e=>{V.iType=e.target.value;rIdeas()};$('#iStat').onchange=e=>{V.iStat=e.target.value;rIdeas()};$('#iStar').onchange=e=>{V.iStar=e.target.checked;rIdeas()};
  $('#iCsv').onclick=()=>{const rows=[['날짜','종류','상태','중요','내용','상세','태그']].concat(list.map(x=>[x.day,IT[x.type].n,IS[x.status].n,x.star?'★':'',x.text,x.note,ideaTags(x).join(' ')]));
    download('아이디어노트_'+todayS()+'.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')};
  $('#iClean').onclick=()=>{const xs=S.ideas.filter(x=>!ideaOpen(x));if(!xs.length)return toast('정리할 완료·보류 항목이 없어요.');
    if(confirm(`완료·보류 상태인 ${xs.length}개를 삭제할까요?\n(필요하면 먼저 엑셀로 저장하세요)`)){S.ideas=S.ideas.filter(ideaOpen);commit();toast(`${xs.length}개 정리했어요.`)}};
}
function editIdea(id){const x=S.ideas.find(y=>y.id===id);if(!x)return;

   const apply=()=>Object.assign(x,{text:$('#iT').value.trim()||x.text,type:$('#iTy').value,status:$('#iSt').value,day:$('#iD').value||x.day,star:$('#iS').checked,note:$('#iN').value,updatedAt:Date.now()});
   $('#iSave').onclick=()=>{apply();closeModal();commit();toast('저장했어요.')};
   $('#iTask').onclick=()=>{apply();closeModal();ideaToTask(x.id)};
   $('#iDel').onclick=()=>{closeModal();delIdea(x.id)};
   $('#iT').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#iSave').click()};
   $('#iN').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))$('#iSave').click()}})}
function ideaToTask(id){const x=S.ideas.find(y=>y.id===id);if(!x)return;
  if(!addTask('day',todayS(),x.text,{pri:x.star||x.type==='todo'?'H':'M',note:x.note||''}))return;
  x.taskId=S.tasks[S.tasks.length-1].id;if(x.status==='new'||x.status==='review')x.status='doing';x.updatedAt=Date.now();commit();toast('오늘 할 일에 추가하고 🚀 실행 중으로 바꿨어요.')}
function delIdea(id){const x=S.ideas.find(y=>y.id===id);if(x&&confirm(`"${x.text.slice(0,30)}"\n삭제할까요?`)){S.ideas=S.ideas.filter(y=>y!==x);commit();toast('삭제했어요.')}}
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.ideaform)return;e.preventDefault();
  const txt=f.text.value;if(!txt.trim())return;addIdea(txt,f.type.value);const ty=f.type.value,where=f.dataset.ideaform;commit();toast(`${IT[ty].i} 저장했어요!`);
  const nf=document.querySelector(`[data-ideaform="${where}"]`);if(nf){nf.type.value=ty;nf.text.focus()}});
document.addEventListener('paste',e=>{const f=e.target.closest&&e.target.closest('[data-ideaform]');if(!f||e.target.name!=='text')return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');if(!txt.includes('\n'))return;e.preventDefault();
  let n=0;txt.split(/\r?\n/).map(s=>s.replace(/^[-•*\d.)\s]+/,'').trim()).filter(Boolean).forEach(l=>{if(addIdea(l,f.type.value))n++});commit();toast(`${n}개 저장했어요.`)});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.istatus;if(!id)return;const x=S.ideas.find(y=>y.id===id);if(!x)return;
  x.status=e.target.value;x.updatedAt=Date.now();commit();toast(`${IS[x.status].i} ${IS[x.status].n}(으)로 변경`)});

/* ---------- 가계부 · 지출 관리 ---------- */
const MCAT_OUT=['원단·자재','생산·공임','택배·물류','마케팅·광고','사무실·임대료','공과금·통신','세금·보험','식비','교통·주유','개인·생활','기타'];
const MCAT_IN=['매출','정산금','기타수입'],PAY=['카드','현금','계좌이체','기타'];
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원';
const numOf=v=>parseInt(String(v).replace(/[^\d]/g,''))||0;
const sumT=(l,t)=>l.filter(m=>m.type===t).reduce((a,m)=>a+m.amount,0);
const moneyRange=(a,b)=>S.money.filter(m=>m.date>=a&&m.date<=b);
function rangeOf(per,ref){const d=parse(ref);
  if(per==='week'){const a=mondayOf(ref);return[a,fmt(addDays(parse(a),6))]}
  if(per==='year')return[ref.slice(0,4)+'-01-01',ref.slice(0,4)+'-12-31'];
  return[monthOf(ref)+'-01',fmt(new Date(d.getFullYear(),d.getMonth()+1,0))]}
function shiftRef(ref,per,n){const d=parse(ref);if(per==='week')return fmt(addDays(d,7*n));if(per==='year')return fmt(new Date(d.getFullYear()+n,0,1));return fmt(new Date(d.getFullYear(),d.getMonth()+n,1))}
function catsUsed(){return[...new Set([...MCAT_OUT,...MCAT_IN,...S.money.map(m=>m.cat)])]}
function moneyForm(id,date){return `<form class="money-add" data-moneyform="${id}">
  <span class="seg"><label><input type="radio" name="type" value="out" checked><span>💸 지출</span></label><label><input type="radio" name="type" value="in"><span>💰 수입</span></label></span>
  <input type="date" name="date" value="${date}"><input type="text" name="amount" inputmode="numeric" placeholder="금액 (원)" autocomplete="off">
  <input type="text" name="cat" list="mc_${id}" placeholder="분류 (선택/입력)"><datalist id="mc_${id}">${catsUsed().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <select name="pay">${PAY.map(p=>`<option>${p}</option>`).join('')}</select>
  <input type="text" name="memo" placeholder="내역 메모 (예: 텐셀 원단 30마, 퀵 배송비)" autocomplete="off"><button class="btn pri">기록</button></form>`}
function moneyRow(m,showDate){return `<tr><td style="width:56px">${m.type==='in'?'<span class="chip green">수입</span>':'<span class="chip red">지출</span>'}</td>${showDate?`<td class="small muted" style="width:60px">${m.date.slice(5).replace('-','/')}</td>`:''}
  <td style="width:110px">${esc(m.cat)}</td><td>${esc(m.memo)}</td><td class="small muted" style="width:70px">${esc(m.pay)}</td><td class="amt ${m.type}" style="width:120px">${m.type==='in'?'+':'-'}${won(m.amount)}</td>
  <td style="width:52px"><span class="ma" style="opacity:1"><button data-mnedit="${m.id}" title="수정">✎</button><button data-mndel="${m.id}" class="x" title="삭제">✕</button></span></td></tr>`}
function openSpend(d){V._spendDay=d;const l=S.money.filter(m=>m.date===d).sort((a,b)=>a.createdAt-b.createdAt),hd=hDone(d,'h_spend');
  modal(`<h3>💸 ${kdate(d)} 지출 확인</h3><p class="small muted">그날 쓴 돈을 하나씩 기록하세요. 기록하면 '지출 확인' 루틴이 자동 체크되고, 가계부에서 주간·월간 결산됩니다.</p>
   ${moneyForm('modal',d)}
   <table class="t">${l.map(m=>moneyRow(m)).join('')||'<tr><td class="muted">아직 기록이 없어요.</td></tr>'}</table>
   <div class="row" style="margin-top:10px"><b>지출 합계 <span class="amt out">${won(sumT(l,'out'))}</span></b>${sumT(l,'in')?`<span>· 수입 <span class="amt in">${won(sumT(l,'in'))}</span></span>`:''}
     <span style="flex:1"></span>${hd?'<span class="chip green">✓ 지출 확인 완료</span>':'<button class="btn" id="noSpend">오늘 지출 없음 ✓</button>'}<button class="btn" data-go2="money" data-close>💰 가계부</button><button class="btn pri" data-close>닫기</button></div>`,
  ()=>{$('[data-moneyform="modal"] input[name=amount]').focus();const ns=$('#noSpend');if(ns)ns.onclick=()=>{(S.habitLog[d]??={}).h_spend=true;closeModal();commit();toast('✅ 지출 확인 완료 (지출 없음)')}})}
function editMoney(id,back){const m=S.money.find(x=>x.id===id);if(!m)return;
  modal(`<h3>✎ 가계부 수정</h3><div class="row">
   <div class="f"><label>구분</label><select id="mnT"><option value="out" ${m.type==='out'?'selected':''}>💸 지출</option><option value="in" ${m.type==='in'?'selected':''}>💰 수입</option></select></div>
   <div class="f"><label>날짜</label><input type="date" id="mnD" value="${m.date}"></div>
   <div class="f"><label>금액</label><input id="mnA" inputmode="numeric" value="${m.amount.toLocaleString('ko-KR')}"></div></div>
   <div class="row"><div class="f"><label>분류</label><input id="mnC" list="mc_edit" value="${esc(m.cat)}"><datalist id="mc_edit">${catsUsed().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
   <div class="f"><label>결제수단</label><select id="mnP">${PAY.map(p=>`<option ${m.pay===p?'selected':''}>${p}</option>`).join('')}</select></div></div>
   <div class="f"><label>내역 메모</label><input id="mnM" value="${esc(m.memo)}"></div>
   <div class="acts"><button class="btn danger" id="mnDel">삭제</button><span style="flex:1"></span><button class="btn" data-close>취소</button><button class="btn pri" id="mnS">저장</button></div>`,()=>{
   const done=()=>{closeModal();commit();if(back)openSpend(back)};
   $('#mnS').onclick=()=>{const a=numOf($('#mnA').value);if(!a)return toast('금액을 입력하세요.');
     Object.assign(m,{type:$('#mnT').value,date:$('#mnD').value||m.date,amount:a,cat:$('#mnC').value.trim()||'기타',pay:$('#mnP').value,memo:$('#mnM').value.trim()});done();toast('수정했어요.')};
   $('#mnDel').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){S.money=S.money.filter(x=>x!==m);done();toast('삭제했어요.')}};
   $('#mnA').oninput=e=>{const n=numOf(e.target.value);e.target.value=n?n.toLocaleString('ko-KR'):''}})}
function delMoney(id,back){const m=S.money.find(x=>x.id===id);if(!m||!confirm(`${m.memo||m.cat} ${won(m.amount)}\n삭제할까요?`))return;S.money=S.money.filter(x=>x!==m);closeModal();commit();toast('삭제했어요.');if(back)openSpend(back)}
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.moneyform)return;e.preventDefault();
  const amount=numOf(f.amount.value);if(!amount){toast('금액을 입력하세요.');return f.amount.focus()}
  const type=f.type.value,date=f.date.value||todayS(),where=f.dataset.moneyform,pay=f.pay.value;
  S.money.push({id:uid(),date,type,amount,cat:f.cat.value.trim()||(type==='in'?'매출':'기타'),pay,memo:f.memo.value.trim(),createdAt:Date.now()});
  if(type==='out'&&S.habits.some(h=>h.id==='h_spend'))(S.habitLog[date]??={}).h_spend=true;
  commit();toast(`${type==='in'?'💰 수입':'💸 지출'} ${won(amount)} 기록했어요.`);
  if(where==='modal')openSpend(date);
  const nf=document.querySelector(`[data-moneyform="${where}"]`);if(nf){nf.querySelector(`input[name=type][value=${type}]`).checked=true;nf.date.value=date;nf.pay.value=pay;nf.amount.focus()}});
document.addEventListener('input',e=>{const t=e.target;if(t.name==='amount'&&t.closest('[data-moneyform]')){const n=numOf(t.value);t.value=n?n.toLocaleString('ko-KR'):''}});
function rMoney(){
  V.mPer??='month';V.mRef??=todayS();const per=V.mPer,[a,b]=rangeOf(per,V.mRef),l=moneyRange(a,b),t=todayS();
  const out=sumT(l,'out'),inc=sumT(l,'in'),dEnd=b<t?b:t,days=a>t?0:Math.round((parse(dEnd)-parse(a))/864e5)+1;
  const label=per==='week'?`${a.slice(5).replace('-','/')} ~ ${b.slice(5).replace('-','/')} 주간`:per==='year'?`${a.slice(0,4)}년`:`${a.slice(0,4)}년 ${+a.slice(5,7)}월`;
  // 분류별 지출
  const cats={};l.filter(m=>m.type==='out').forEach(m=>cats[m.cat]=(cats[m.cat]||0)+m.amount);

  const topCat=x=>{const c={};x.filter(m=>m.type==='out').forEach(m=>c[m.cat]=(c[m.cat]||0)+m.amount);const e=Object.entries(c).sort((p,q)=>q[1]-p[1])[0];return e?`${esc(e[0])} ${won(e[1])}`:'-'};
  const chg=(cur,prev)=>prev?`<span class="${cur>prev?'up':'down'}">${cur>prev?'▲':'▼'} ${Math.abs(Math.round((cur-prev)/prev*100))}%</span>`:'-';

    <span style="flex:1"></span><button class="btn" id="mnCsv">⬇ 엑셀(CSV)</button><button class="btn" onclick="window.print()">🖨 인쇄</button></div>

    <div class="stat"><div class="l">💰 총 수입</div><div class="n amt in" style="text-align:left">${won(inc)}</div><div class="small muted">${l.filter(m=>m.type==='in').length}건</div></div>

    <div class="stat"><div class="l">하루 평균 지출</div><div class="n">${won(days?out/days:0)}</div><div class="small muted">${days}일 기준</div></div>
  </div>
  ${per==='month'?`<div class="card sec"><h3>🎯 ${+mk.slice(5)}월 지출 예산 <span class="r"><input class="field" id="budIn" inputmode="numeric" placeholder="예산 입력" value="${bud?bud.toLocaleString('ko-KR'):''}" style="width:140px;text-align:right"><button class="btn sm" id="budSave">저장</button></span></h3>
    ${bud?`<div class="bar" style="height:12px"><i style="width:${bp}%;${out>bud?'background:var(--danger)':''}"></i></div><div class="small" style="margin-top:6px">${won(out)} / ${won(bud)} 사용 (${Math.round(out/bud*100)}%) · ${out>bud?`<b style="color:var(--danger)">${won(out-bud)} 초과!</b>`:`남은 예산 <b>${won(bud-out)}</b>`}</div>`:'<div class="small muted">한 달 지출 예산을 정해두면 사용률을 보여드려요.</div>'}</div>`:''}

function rYear(){

  const jd=Object.keys(S.journals).filter(k=>k.startsWith(ys)&&jHas(S.journals[k]));
  const total=Object.values(cnt).reduce((a,b)=>a+b,0),active=Object.keys(cnt).length;
  const jan1=new Date(Y,0,1),start=addDays(jan1,-((jan1.getDay()+6)%7));let cells='';
  for(let d=new Date(start);d.getFullYear()<=Y;d=addDays(d,1)){const s=fmt(d),n=cnt[s]||0;
    cells+=d.getFullYear()<Y?'<i class="none"></i>':`<i class="${n>=10?'l4':n>=6?'l3':n>=3?'l2':n>=1?'l1':''}" data-seldate="${s}" title="${s} · 완료 ${n}건${S.journals[s]?' · 일지':''}"></i>`}

   <div class="stat"><div class="l">업무일지</div><div class="n">${jd.length}일</div><div class="small muted">평균 만족도 ${avg}</div></div>
   <div class="stat"><div class="l">연간 목표 달성</div><div class="n">${goals.filter(g=>g.done).length}/${goals.length}</div></div></div>
  ${S.habits.length?`<div class="card sec"><h3>🌅 ${Y}년 루틴 기록</h3><table class="t"><tr><th>루틴</th><th>실행한 날</th><th>누적 시간</th><th>현재 연속</th></tr>
    ${S.habits.map(h=>{const n=Object.entries(S.habitLog).filter(([k,v])=>k.startsWith(ys)&&v[h.id]).length;return `<tr><td>${h.icon||''} ${esc(h.text)}</td><td>${n}일</td><td>${fmtMin(n*(+h.min||0))}</td><td>🔥 ${hStreak(h.id)}일</td></tr>`}).join('')}</table></div>`:''}
  <div class="card sec"><h3>🔥 ${Y}년 실행 히트맵 <span class="r small muted">진할수록 완료 업무가 많은 날 · 칸 클릭 시 해당 날짜로 이동</span></h3><div class="heat">${cells}</div></div>

  </div>

}

async function deriveKey(salt){const id=SC.pw+'|'+b64(salt);if(Sync.kc&&Sync.kc.id===id)return Sync.kc.key;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(SC.pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  Sync.kc={id,key};return key}
async function encryptObj(o){let data=new TextEncoder().encode(JSON.stringify(o)),z=0;const c=await gz(data,'c');if(c){data=c;z=1}
  if(!SC.salt){SC.salt=b64(crypto.getRandomValues(new Uint8Array(16)));saveSC()}
  const salt=ub64(SC.salt),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(salt),data));
  return JSON.stringify({app:'miracle-planner',v:1,z,salt:SC.salt,iv:b64(iv),data:b64(ct)})}
async function decryptObj(txt){const o=JSON.parse(txt);if(!o.data)return null;SC.salt=o.salt;let pt;
  try{pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},await deriveKey(ub64(o.salt)),ub64(o.data)))}catch(e){throw new Error('DECRYPT')}
  if(o.z){const d=await gz(pt,'d');if(!d)throw new Error('OLD');pt=d}
  return JSON.parse(new TextDecoder().decode(pt))}
const payload=st=>{const o={ks:st.ks,tomb:st.tomb};['tasks','memos','routines','ddays','habits','ideas','money','yearGoals','journals','weekNotes','monthNotes','routineApplied','habitLog','moneyBudget','cats','customQuotes'].forEach(k=>o[k]=st[k]);return o};
const Sync={busy:false,again:false,state:'off',msg:'',timer:null,
  on(){return !!(SC.token&&SC.gistId&&SC.pw)},
  soon(ms=2500){if(!this.on())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),ms)},
  set(st,msg=''){this.state=st;this.msg=msg;updSyncBadge()},
  async api(path,opt={}){const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{cache:'no-store',
      headers:Object.assign({'Authorization':'token '+SC.token,'Accept':'application/vnd.github+json'},opt.body?{'Content-Type':'application/json'}:{})}));
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()},
  async run(){
    if(!this.on())return this.set('off');
    if(this.busy){this.again=true;return}
    if(!navigator.onLine)return this.set('offline','인터넷 연결 없음 — 연결되면 자동 동기화');
    if($('#mask'))return this.soon(4000); // 편집 창이 열려 있으면 닫힌 뒤에
    this.busy=true;this.set('busy');
    try{
      const g=await this.api('/gists/'+SC.gistId),f=g.files&&g.files[GFILE];let remote=null;
      if(f){const txt=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;if(txt&&txt.trim()!=='{}')remote=await decryptObj(txt)}
      const before=canon(S),merged=remote?mergeStates(S,remote):S,mc=canon(merged);
      if(remote&&mc!==before){const oldQ=JSON.stringify(S.customQuotes);S=Object.assign(merged,{settings:S.settings,lastBackup:S.lastBackup});prevJ=unitsJSON(S);rawSave();
        if(JSON.stringify(S.customQuotes)!==oldQ)buildSlides();refreshAfterSync()}
      if(!remote||mc!==canon(remote))await this.api('/gists/'+SC.gistId,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:await encryptObj(payload(S))}}})});
      SC.last=Date.now();saveSC();this.set('ok');
    }catch(e){this.set('err',e.status===401?'GitHub 토큰이 만료되었거나 잘못되었어요. 설정에서 다시 연결해 주세요.':e.status===404?'동기화 저장소를 찾을 수 없어요. 설정에서 다시 연결해 주세요.':
      e.message==='DECRYPT'?'동기화 비밀번호가 다른 기기와 달라요.':e.message==='OLD'?'이 기기의 브라우저가 오래되어 동기화할 수 없어요. 업데이트해 주세요.':'연결 실패 — 잠시 후 자동으로 다시 시도합니다.')}
    finally{this.busy=false;if(this.again){this.again=false;this.soon(500)}}
  }};
let pendingRender=false;
const editing=()=>{const a=document.activeElement;return a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.id!=='gsearch'&&a.value};
function refreshAfterSync(){if(editing()){pendingRender=true;return}render();toast('☁️ 다른 기기의 변경 내용을 반영했어요.')}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!editing()&&!$('#mask')){pendingRender=false;render()}},300));
function updSyncBadge(){const b=$('#syncBtn');if(!b)return;const t=SC.last?new Date(SC.last).toTimeString().slice(0,5):'';
  const L={off:['☁️','동기화 꺼짐'],busy:['🔄','동기화 중…'],ok:['☁️','동기화됨 '+t],offline:['📴','오프라인'],err:['⚠️','동기화 오류']}[Sync.state];
  b.innerHTML=`${L[0]} <span class="t">${L[1]}</span>`;b.className='btn syncb '+Sync.state;b.title=Sync.msg||(Sync.on()?'클릭하면 지금 동기화':'클릭해서 자동 동기화 설정');
  if(V.view==='settings'&&$('#syncStat'))$('#syncStat').innerHTML=syncStatText()}
function syncStatText(){return Sync.state==='err'?`<span style="color:var(--danger)">⚠️ ${esc(Sync.msg)}</span>`:Sync.state==='offline'?'📴 오프라인 — 인터넷이 연결되면 자동으로 동기화됩니다.':
  Sync.state==='busy'?'🔄 동기화 중…':SC.last?`✅ 마지막 동기화: ${new Date(SC.last).toLocaleString('ko-KR')}`:''}
function syncCardHTML(){
  if(Sync.on())return `<h3>☁️ 자동 동기화 <span class="chip green">켜짐</span></h3>
    <p class="small">GitHub 계정 <b>${esc(SC.login||'')}</b> 에 <b>암호화</b>되어 저장됩니다. 변경하면 몇 초 안에 자동으로 올라가고, 다른 기기는 앱을 열거나 30초마다 자동으로 받아옵니다.</p>
    <p class="small" id="syncStat">${syncStatText()}</p>
    <div class="row"><button class="btn pri" id="syncNow">🔄 지금 동기화</button><button class="btn danger" id="syncOff">연결 해제 (이 기기만)</button></div>
    <p class="small muted">다른 기기 추가: 그 기기의 [설정 · 백업]에서 <b>같은 GitHub 토큰</b>과 <b>같은 동기화 비밀번호</b>를 입력하면 됩니다.</p>`;
  return `<h3>☁️ 자동 동기화 (맥 · 윈도우 · 아이폰 · 아이패드) <span class="chip">꺼짐</span></h3>
    <p class="small muted">모든 기기의 할일 · 메모 · 일지가 자동으로 같아집니다. 데이터는 <b>내 비밀번호로 암호화</b>되어 내 GitHub 계정의 비공개 저장소에만 저장됩니다. 인터넷이 없을 땐 그대로 쓰고, 연결되면 자동으로 맞춰집니다.</p>
    <ol class="sync-steps">
      <li><a href="https://github.com/signup" target="_blank" rel="noopener">GitHub 무료 가입</a> (이미 있으면 건너뛰기)</li>
      <li><a href="${TOKEN_URL}" target="_blank" rel="noopener"><b>동기화 토큰 만들기</b></a> 클릭 → Expiration(만료)을 <b>No expiration</b> 으로 → 맨 아래 <b>Generate token</b> → <b>ghp_</b>로 시작하는 토큰 복사<br>
        <span class="small muted">※ 처음 기기에서 한 번만 만들고, 이 토큰을 메모장 등에 보관해 다른 기기에도 똑같이 붙여넣으세요.</span></li>
      <li>토큰 붙여넣기 <input class="field" id="syTok" placeholder="ghp_로 시작하는 토큰" autocomplete="off" autocapitalize="off" spellcheck="false"></li>
      <li>동기화 비밀번호 (모든 기기에서 똑같이, 잊지 마세요!) <input class="field" id="syPw" type="password" placeholder="6자 이상" autocomplete="new-password"></li>
    </ol>
    <div class="row" style="margin-top:8px"><button class="btn pri" id="syGo">☁️ 연결하고 동기화 시작</button><span class="small" id="syncStat">${Sync.state==='err'?syncStatText():''}</span></div>`}
function bindSyncCard(){
  const now=$('#syncNow');if(now)now.onclick=()=>Sync.run();
  const off=$('#syncOff');if(off)off.onclick=()=>{if(confirm('이 기기의 자동 동기화를 끌까요?\n(이 기기의 데이터와 다른 기기는 그대로 유지됩니다)')){SC={};saveSC();Sync.set('off');render()}};
  const go=$('#syGo');if(go)go.onclick=async()=>{const token=$('#syTok').value.trim(),pw=$('#syPw').value;
    if(!/^(ghp_|github_pat_|gho_)/.test(token))return toast('토큰을 정확히 붙여넣어 주세요 (ghp_로 시작).');
    if(pw.length<6)return toast('동기화 비밀번호는 6자 이상으로 해주세요.');
    if(!navigator.onLine)return toast('인터넷에 연결된 상태에서 설정해 주세요.');
    go.disabled=true;go.textContent='연결 중…';
    try{SC={token,pw};const u=await Sync.api('/user');
      let g=null;for(let page=1;page<=5&&!g;page++){const list=await Sync.api('/gists?per_page=100&page='+page);g=list.find(x=>x.description===GIST_DESC&&x.files&&x.files[GFILE]);if(list.length<100)break}
      const isNew=!g;
      if(!g)g=await Sync.api('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files:{[GFILE]:{content:'{}'}}})});
      SC={token,pw,gistId:g.id,login:u.login};saveSC();await Sync.run();
      if(Sync.state==='err'){const m=Sync.msg;SC={};saveSC();Sync.set('off');render();return alert('연결 실패: '+m+(m.includes('비밀번호')?'\n처음 기기에서 정한 동기화 비밀번호를 입력해 주세요.':''))}
      render();toast(isNew?'✅ 동기화 시작! 다른 기기에서도 같은 토큰·비밀번호로 연결하세요.':'✅ 연결 완료! 다른 기기의 데이터와 합쳤어요.');
    }catch(e){SC={};saveSC();go.disabled=false;go.textContent='☁️ 연결하고 동기화 시작';
      alert(e.status===401?'토큰이 올바르지 않아요. 다시 복사해 주세요.':e.status===403?'토큰에 gist 권한이 없어요. [동기화 토큰 만들기] 링크로 다시 만들어 주세요.':'연결 실패: 인터넷 연결을 확인해 주세요.')}}}
$('#syncBtn').onclick=()=>{if(Sync.on())Sync.run();else go('settings')};
window.addEventListener('online',()=>Sync.soon(500));window.addEventListener('offline',()=>{if(Sync.on())Sync.set('offline','인터넷 연결 없음')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Sync.soon(300)});
window.addEventListener('focus',()=>Sync.soon(300));
setInterval(()=>{if(document.visibilityState==='visible')Sync.run()},30000);
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme;$('#themeBtn').textContent=S.settings.theme==='dark'?'☀️':'🌙'}
$('#themeBtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();applyTheme()};

/* 날짜가 바뀌면(자정 넘어 켜둔 경우) 자동 갱신 */
let lastDay=todayS();
setInterval(()=>{if(todayS()!==lastDay){lastDay=todayS();V.sel=lastDay;V.cal=monthOf(lastDay);applyRoutines();buildSlides();if(V.view==='home')render()}},60000);

applyTheme();applyRoutines();buildSlides();render();updSyncBadge();if(Sync.on())Sync.run();
/* 웹(아이폰·아이패드) 설치용: http(s)로 열렸을 때만 오프라인 캐시 등록 */
if(location.protocol.startsWith('http')){
  const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
if(!S.tasks.length&&!S.memos.length&&!localStorage.getItem(KEY+'_welcomed')){try{localStorage.setItem(KEY+'_welcomed','1')}catch(e){}
  toast('환영합니다! 오늘 할 일을 입력해 보세요 🚀')}
</script>
